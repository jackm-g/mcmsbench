# Night, nothing carried, and stone underfoot four blocks deep: a bare hand breaks it slowly and gets nothing
# back, so the pit has no cap. secure_night() must get its blocks elsewhere (planks from the nearest tree) or
# settle for the open-topped pit and stay in it. Passing is being alive in the morning.
prompt: >-
  It is night, you have nothing, and you stand on bare stone. Get enclosed until morning: bot.secure_night()
  does that. When the sun is up (bot.status()['timeOfDay'] below 12000), say so and finish.
inventory: {}
world: {type: survival, seeds: [1], daylight: true, difficulty: normal}
start: {time: 19500}
setup:
  - "fill {sx-8} {sy-4} {sz-8} {sx+8} {sy-1} {sz+8} minecraft:stone"
  - "fill {sx-8} {sy} {sz-8} {sx+8} {sy+4} {sz+8} minecraft:air"
movements: {can_dig: true, towers: true, scaffolding: [dirt, cobblestone]}
stats: [deaths, damage_taken, kills, walked]
grader:
  kind: milestones
  required: [alive, morning]
  steps:
    - {name: alive,   weight: 3, hold: true, check: {kind: survived}}
    - {name: morning, weight: 2, check: {kind: world_time, between: [23000, 6000]}}
max_turns: 6
max_seconds: 600
tags: [tier-c, survival, night, situation, protocol]
