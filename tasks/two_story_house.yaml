# Params (variants.py): the public instance is the one written here. The varied and held-out splits draw the
# smallest footprint (6x6 to 8x8), how many doors (2 or 3), chests (2..4) and rugs (4..10), and the wood.
params:
  side: {default: 6, range: [6, 8]}
  doors: {default: 2, range: [2, 3]}
  chests: {default: 2, range: [2, 4]}
  rugs: {default: 6, range: [4, 10]}
  wood: {default: oak, choices: [oak, spruce, birch]}
prompt: >-
  Build a furnished two-story house somewhere inside your plot, using the materials you are carrying.
  The shell: at least ${side}x${side} on the outside, walls all the way round, a roof, and two separate floors a
  player can stand on (ground floor and an upstairs, each with at least 2 blocks of headroom), joined
  by a ladder or a staircase so a player can actually get from one to the other.
  The fittings: at least ${['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][doors]} doors (a front door plus ${['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][doors - 1]} more); a pressure plate right next to a door
  on each side of the front door so it opens as you walk through; a bed in the upstairs room; at least
  ${['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][chests]} storage chests inside; and rugs (carpet) on the floor inside, at least ${['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][rugs]} pieces. Windows and
  torches are welcome but optional. Check your work before you finish.
anchor: [12, 0, 12]
inventory:
  ${wood}_planks: ${int(448 * side * side / 36)}
  cobblestone: 64
  glass: 24
  ${wood}_stairs: 24
  ladder: 12
  ${wood}_door: ${doors + 1}
  ${wood}_pressure_plate: 4
  red_bed: 1
  chest: ${chests + 1}
  red_carpet: 16
  white_carpet: 16
  torch: 16
grader:
  kind: milestones
  required: [shell, two_stories, doors, pressure_plates, bed_upstairs, chests, rugs]
  steps:
    - {name: shell,           weight: 3, check: {kind: structure, min_footprint: ${side * side}, min_interior: ${(side - 2) * (side - 2) + 8}, min_placed: ${int(100 * side * side / 36)}}}
    - {name: two_stories,     weight: 3, check: {kind: stories, count: 2, min_area: 12, connected: true}}
    - {name: doors,           weight: 1, check: {kind: furnishings, items: [{item: "*_door", count: ${doors}}]}}
    - {name: pressure_plates, weight: 1, check: {kind: furnishings, items: [{item: "*_pressure_plate", count: 2, next_to: "*_door"}]}}
    - {name: bed_upstairs,    weight: 1, check: {kind: furnishings, min_area: 12, items: [{item: "*_bed", count: 1, story: 2}]}}
    - {name: chests,          weight: 1, check: {kind: furnishings, items: [{item: [chest, barrel, trapped_chest], count: ${chests}, inside: true}]}}
    - {name: rugs,            weight: 1, check: {kind: furnishings, items: [{item: "*_carpet", count: ${rugs}, inside: true}]}}
max_turns: 30
max_seconds: 1800
tags: [tier-d, building, open-ended, composite]
