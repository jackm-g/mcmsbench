# A ranged fight in a big netherrack room: the ghast floats out of sword reach and shoots back.
# bot.shoot aims the bow (minecrafthawkeye trajectory); two good arrows kill it. A ghast drifts, so a
# sword can sometimes reach it; the bow is required because that is what was asked for.
prompt: >-
  A ghast is in this room and it is shooting at you. Kill it with your bow and stay alive.
world: {type: flat, dimension: the_nether, difficulty: easy, size: 48, height: 24}
inventory: {bow: 1, arrow: 32, iron_sword: 1, bread: 4}
setup:
  - "execute as {bot} at @s run summon minecraft:ghast ~14 ~8 ~ {{PersistenceRequired:1b}}"
stats: [deaths, damage_taken, "killed:ghast", "used:bow"]
grader:
  kind: milestones
  required: [ghast_dead, alive, shot]     # "with your bow": a sword kill on a low pass does not count
  steps:
    - {name: shot,       weight: 1, check: {kind: stat, name: "used:bow", min: 1}}
    - {name: ghast_dead, weight: 4, check: {kind: stat, name: "killed:ghast", min: 1}}
    - {name: alive,      weight: 2, hold: true, check: {kind: survived}}
max_turns: 8
max_seconds: 300
tags: [tier-c, nether, combat, ranged]
