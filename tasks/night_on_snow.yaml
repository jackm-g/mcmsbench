# The world spawn on the live server, 2026-09-23: snowy, hilly, and the bot respawning there at night with
# nothing died within the minute four times in one evening, the harness saying "nothing held" each time.
# The ground here is snow (rung 4 did not know it), the top layer is a snow cover, the bot carries nothing,
# and night is well on. Passing is being alive in the morning: secure_night() (the curfew runs it) must dig
# in through the snow, cap the pit with the dirt it finds under it, and wait for the sun.
prompt: >-
  It is night, you have nothing, and the ground here is snow. Get enclosed until morning: bot.secure_night()
  does that. When the sun is up (bot.status()['timeOfDay'] below 12000), say so and finish.
inventory: {}
world: {type: survival, seeds: [1], daylight: true, difficulty: normal}
start: {time: 19500}
setup:
  - "fill {sx-8} {sy-1} {sz-8} {sx+8} {sy-1} {sz+8} minecraft:snow_block"
  - "fill {sx-8} {sy} {sz-8} {sx+8} {sy+4} {sz+8} minecraft:air"
  - "fill {sx-8} {sy} {sz-8} {sx+8} {sy} {sz+8} minecraft:snow"
movements: {can_dig: true, towers: true, scaffolding: [dirt, cobblestone]}
stats: [deaths, damage_taken, kills, walked]
grader:
  kind: milestones
  required: [alive, morning]
  steps:
    - {name: alive,   weight: 3, hold: true, check: {kind: survived}}
    - {name: morning, weight: 2, check: {kind: world_time, between: [23000, 6000]}}
max_turns: 6
max_seconds: 600
tags: [tier-b, survival, night, situation, protocol]
