# The live server, 2026-09-26 00:42 and 00:55: milestone 5 of the player's project ("return to your base ... cook some
# food") failed twice at the wrong base. The journal's home was the harness's first pick, a spruce hut at (-15, 620);
# the bot had since built a house 850 blocks away at (-694, 110), a player had called it "your house", and the
# respawn point was set on the bed there (m267, 23:16). Home never moved, so live's routing read "at the base" as the
# old hut: each task walked four minutes back to it and did the work there ($2.21, 51 minutes, both unfinished).
#
# The bot starts in its new base (a bed its respawn point is on, a chest, a crafting table, a furnace, a wheat
# plot) with the diamonds milestone 4 asked it to store. The journal is the stale one live had: home is the old
# hut 86 blocks off (which has a chest of its own), older than the note of the new house and the respawn bed. The
# eval runner routes the prompt as live does (route_to_home), so "your base" is whatever the journal's places say.
# Passing takes the diamonds in the new base's chest, without walking to the old hut.
profile: prod
prompt: >-
  Return to your base and store your diamonds in the chest there: end with all 6 diamonds in the base's chest and
  none carried.
inventory: {diamond: 6, stone_pickaxe: 1, stone_sword: 1, bread: 4, cobblestone: 16}
start: {offset: [40, 0], time: 1000, weather: clear}
movements: {can_dig: true, towers: true, scaffolding: [dirt, cobblestone]}
memories:
  - {slot: home, text: "the spruce hut: chest and crafting table inside", at: "{bx+70} {by} {bz+50}", ago: 90000}
  - {text: "Built a 5x5 hut here with a chest and a crafting table.", at: "{bx+70} {by} {bz+50}", ago: 86400}
  - {text: "Built the house here: bed, chest, crafting table and furnace just north, the wheat plot just south with its water.",
     at: "{bx} {by} {bz}", ago: 7200}
  - {slot: spawn, text: "respawn point: set on the bed at ({bx-2}, {by}, {bz-3}); a death puts you back here, not at the world spawn",
     at: "{bx-2} {by} {bz-3}", ago: 3600}
setup:
  # the new base, where the bot stands: ground, a bed, the chest, a table and a furnace, a wheat plot with its water
  - "fill {bx-6} {by} {bz-6} {bx+6} {by+4} {bz+6} minecraft:air"
  - "fill {bx-6} {by-4} {bz-6} {bx+6} {by-2} {bz+6} minecraft:dirt replace air"
  - "fill {bx-6} {by-1} {bz-6} {bx+6} {by-1} {bz+6} minecraft:grass_block"
  - "setblock {bx-2} {by} {bz-4} minecraft:white_bed[facing=north,part=head]"
  - "setblock {bx-2} {by} {bz-3} minecraft:white_bed[facing=north,part=foot]"
  - "setblock {bx} {by} {bz-4} minecraft:chest[facing=south]"
  - "setblock {bx+2} {by} {bz-4} minecraft:crafting_table"
  - "setblock {bx+3} {by} {bz-4} minecraft:furnace[facing=south]"
  - "setblock {bx} {by-1} {bz+3} minecraft:water"
  - "fill {bx-2} {by-1} {bz+2} {bx+2} {by-1} {bz+2} minecraft:farmland[moisture=7]"
  - "fill {bx-2} {by} {bz+2} {bx+2} {by} {bz+2} minecraft:wheat[age=3]"
  # the old hut 86 blocks south-east, past the plot's loaded chunks: a stone pad on a plinth to the ground, a 5x5
  # cobblestone shell with a doorway, its chest and table inside
  - "forceload add {bx+62} {bz+42} {bx+78} {bz+58}"
  - "fill {bx+66} {by-12} {bz+46} {bx+74} {by-2} {bz+54} minecraft:stone replace air"
  - "fill {bx+66} {by-1} {bz+46} {bx+74} {by-1} {bz+54} minecraft:stone"
  - "fill {bx+66} {by} {bz+46} {bx+74} {by+4} {bz+54} minecraft:air"
  - "fill {bx+68} {by-1} {bz+48} {bx+72} {by+2} {bz+52} minecraft:cobblestone hollow"   # bottom face is the floor: interior 2 tall
  - "fill {bx+70} {by} {bz+52} {bx+70} {by+1} {bz+52} minecraft:air"
  - "setblock {bx+69} {by} {bz+49} minecraft:chest[facing=south]"
  - "setblock {bx+71} {by} {bz+49} minecraft:crafting_table"
own:   # both are the bot's own builds, as live's registry knows them
  - "{bx-6} {by-1} {bz-6} {bx+6} {by+1} {bz+6}"
  - "{bx+68} {by-1} {bz+48} {bx+72} {by+2} {bz+52}"
grader:
  kind: milestones
  required: [stored, stayed, alive]
  steps:
    - name: stored
      weight: 4
      check:
        kind: functional
        steps:
          - {assert: "execute if block {bx} {by} {bz-4} minecraft:chest{{Items:[{{id:\"minecraft:diamond\"}}]}}"}
    - {name: none_carried, weight: 1, hold: true, check: {kind: inventory, item: diamond, max: 0}}
    - {name: stayed,       weight: 3, hold: true, check: {kind: stayed, target_rel: [40, 0], radius: 40}}   # the old hut is 86 off
    - {name: alive,        weight: 2, hold: true, check: {kind: survived}}
scripted: false   # no reference solutions: validated by the unit tests and LLM trials
max_turns: 12
max_seconds: 480
exec_timeout: 240
tags: [tier-c, survival, prod, memory, sites]
