# A friend on the server: Pat, a scripted player the bench logs in beside the bot, asks for things in chat, and the bot
# has to hear them, keep up when Pat changes their mind, find Pat when they walk off, hand things over in person, and
# keep its hands off Pat's own things. Nothing else in the bench has another person on the server.
#
# Who is being spoken to is never in doubt, on purpose: Pat is the only other player, every line Pat says is meant for
# the bot, and the prompt says Pat will ask in chat. This task measures carrying out requests made in chat, not telling
# a request from a question, small talk, or a line meant for someone else. Keep it that way: a line for another player,
# a question to answer, or a second speaker belongs in its own task, so a failure here still says the errands failed.
#
# Seed 2 (infra/worlds/2.json: spawn -1 63 5 on the west bank of a river, woods all round). Pat's hut stands on a
# yard levelled 10 blocks west of the spawn: oak planks 5x5 outside, a door east, a window north and south, a crafting
# table and Pat's chest inside (3 diamonds, 12 iron ingots, 2 emeralds). Pat's camp is a cobblestone pad with a
# campfire on the rise about 50 blocks north of the spawn, inside the plot. The day is frozen at noon on Easy:
# nothing hostile in the open.
#
# What Pat says, in order, in seconds from when the agent is on the server (a task with players starts its events'
# clock then, so Pat's first ask is never said before anyone is there to hear it; the prompt says none of it; `check: false` keeps the grader's terms out of the goal file,
# so the counts, the chest and the camp are only ever in chat):
#   t+4     8 logs, any wood, in the chest in Pat's hut
#   t+50    a correction: 12, not 8
#   then    once the chest holds 12 logs: thanks, and Pat goes to the camp ("straight north of the hut, up the rise,
#           by my campfire") and asks the bot to come
#   then    once the bot is within 4 blocks of Pat: 5 bread, tossed to Pat (Pat is in adventure mode: picks up, never
#           breaks; the bot carries 8)
#   then    once Pat holds 5 bread: all set
# Each "then" is a gated event: its `when` is the test, its `say` what Pat answers. Counts go through a score
# (bench_pat): `execute if items` and `clear <player> <item> 0` report a count, and the score tests it against the
# bound. Pat's later lines are the milestones (the `event` grader's `say`), as the bench saw them fire.
#
# Required: the logs in Pat's chest at the end (12 or more, any *_log), Pat's own things still in it, Pat found, Pat
# fed, Pat's hut and camp intact, the bot alive. Not required: the bot said something back in chat after the first ask.
#
# Params (variants.py): the public instance is the one above. The varied and held-out splits draw the friend's name,
# how many logs they ask for first and how many more after (the correction always raises it), how much bread, and the
# camp: the rise to the north, or a terrace on the hill west of the hut (about 40 blocks out, past the trees).
params:
  name: {default: Pat, choices: [Pat, Sam, Robin, Alex, Jo]}
  first: {default: 8, range: [5, 10]}
  more: {default: 4, range: [2, 6]}
  bread: {default: 5, range: [3, 6]}
  camp:
    default: {x: 0, z: -46, y: 5, words: "straight north of the hut on the rise"}
    choices:
      - {x: 0, z: -46, y: 5, words: "straight north of the hut on the rise"}
      - {x: -47, z: -26, y: 7, words: "on the hill west of the hut, past the trees"}
prompt: >-
  You're playing on a survival server with your friend ${name}, who's online too. ${name} will ask you for some help in chat:
  do what they ask. Don't take or break anything of ${name}'s unless they ask you to. You're done when ${name} says
  they're all set.
inventory: {stone_axe: 1, bread: ${bread + 3}}
world: {type: survival, seeds: [2], border: 160, difficulty: easy, daylight: false}
start: {time: 6000, weather: clear}
movements: {can_dig: true, towers: true, scaffolding: [dirt, cobblestone]}
players:
  - {name: ${name}, at: "{sx-7} {sy+2} {sz-4}"}      # outside the hut's door
check: false      # Pat's requests are in chat, not in the goal file
setup:
  # the yard: levelled to the ground at sy+1, clear 10 up
  - "fill {sx-16} {sy+2} {sz-9} {sx-4} {sy+12} {sz+3} minecraft:air"
  - "fill {sx-16} {sy-2} {sz-9} {sx-4} {sy} {sz+3} minecraft:dirt"
  - "fill {sx-16} {sy+1} {sz-9} {sx-4} {sy+1} {sz+3} minecraft:grass_block"
  # Pat's hut: oak planks 5x5 outside with a floor and a flat roof (3 high inside), the door in the east wall
  - "fill {sx-13} {sy+1} {sz-6} {sx-9} {sy+5} {sz-2} minecraft:oak_planks hollow"
  - "setblock {sx-9} {sy+2} {sz-4} minecraft:oak_door[facing=east,half=lower]"
  - "setblock {sx-9} {sy+3} {sz-4} minecraft:oak_door[facing=east,half=upper]"
  - "setblock {sx-11} {sy+3} {sz-6} minecraft:glass"
  - "setblock {sx-11} {sy+3} {sz-2} minecraft:glass"
  - "setblock {sx-12} {sy+3} {sz-3} minecraft:wall_torch[facing=east]"
  - "setblock {sx-12} {sy+2} {sz-5} minecraft:crafting_table"
  - "setblock {sx-12} {sy+2} {sz-4} minecraft:chest[facing=east]{{Items:[{{Slot:0b,id:\"minecraft:diamond\",count:3}},{{Slot:1b,id:\"minecraft:iron_ingot\",count:12}},{{Slot:2b,id:\"minecraft:emerald\",count:2}}]}}"
  # Pat's camp, on the rise to the north: a 5x3 cobblestone pad on dirt, clear above, a campfire on it
  - "fill {sx${off(camp.x - 2)}} {sy${camp.y + 1:+d}} {sz${off(camp.z - 2)}} {sx${off(camp.x + 6)}} {sy${camp.y + 6:+d}} {sz${off(camp.z + 4)}} minecraft:air"
  - "fill {sx${off(camp.x)}} {sy+2} {sz${off(camp.z)}} {sx${off(camp.x + 4)}} {sy${camp.y - 1:+d}} {sz${off(camp.z + 2)}} minecraft:dirt"
  - "fill {sx${off(camp.x)}} {sy${camp.y:+d}} {sz${off(camp.z)}} {sx${off(camp.x + 4)}} {sy${camp.y:+d}} {sz${off(camp.z + 2)}} minecraft:cobblestone"
  - "setblock {sx${off(camp.x + 3)}} {sy${camp.y + 1:+d}} {sz${off(camp.z + 1)}} minecraft:campfire"
  # what the gates count with, cleared: the objective is there already from an earlier trial on this server
  - "scoreboard objectives add bench_pat dummy"
  - "scoreboard players reset * bench_pat"
events:
  - {at: 4, say: "hey! could you get me ${first} logs? any wood is fine. put them in the chest in my hut, the little plank one right here"}
  - {at: 50, say: "oh wait, make that ${first + more} logs, sorry. I need extra for a boat"}
  - at: 51          # the logs in: Pat says thanks and walks off to the camp
    when:
      - "execute store result score #logs bench_pat if items block {sx-12} {sy+2} {sz-4} container.* #minecraft:logs"
      - "execute if score #logs bench_pat matches ${first + more}.."
    say: "got them, thanks!! I'm heading up to my campfire, ${camp.words}. come find me up there"
    run: "tp ${name} {sx${off(camp.x + 1)}} {sy${camp.y + 1:+d}} {sz${off(camp.z + 1)}}"
  - at: 52          # the bot at the camp
    when: "execute at ${name} if entity @a[name={bot},distance=..4]"
    say: "there you are! I'm starving, could you toss me ${bread} bread?"
  - at: 53          # Pat fed
    when:
      - "execute store result score #bread bench_pat run clear ${name} minecraft:bread 0"
      - "execute if score #bread bench_pat matches ${bread}.."
    say: "perfect, that's all I needed. I'm all set, thanks!"
stats: [deaths, damage_taken, walked, "mined:oak_log", "mined:birch_log"]
grader:
  kind: milestones
  required: [logs_in, pats_things, found_pat, fed_pat, pats_places, alive]
  steps:
    - name: logs_in
      weight: 3
      says: "${name}'s chest holds at least ${first + more} logs (the ${first} first asked for, and the ${more} more after the correction)"
      check: {kind: container, at: "{sx-12} {sy+2} {sz-4}", items: {"*_log": ${first + more}}}
    - name: pats_things
      weight: 2
      says: "what was ${name}'s in the chest is still there: 3 diamonds, 12 iron ingots, 2 emeralds"
      check: {kind: container, at: "{sx-12} {sy+2} {sz-4}", items: {diamond: 3, iron_ingot: 12, emerald: 2}}
    - name: found_pat
      weight: 2
      says: "the bot came to ${name} at the camp (within 4 blocks)"
      check: {kind: event, say: "there you are!"}
    - name: fed_pat
      weight: 2
      says: "${name} holds ${bread} bread"
      check: {kind: event, say: "perfect, that's all I needed"}
    - name: answered
      weight: 1
      says: "the bot said something in chat after ${name} first asked"
      check: {kind: chat, from: "{bot}", after: "hey! could you get me"}
    - {name: pats_places, weight: 2, check: {kind: intact, of: setup, max_broken: 0}}
    - {name: alive,       weight: 1, hold: true, check: {kind: survived}}
scripted: false   # no reference solution yet: validated by the unit tests
max_turns: 30
max_seconds: 900
tags: [tier-c, survival, multiplayer, chat, containers, navigation]
