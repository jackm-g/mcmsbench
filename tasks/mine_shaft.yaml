# A safe staircase down through natural ground: the mechanical start of every mine. The grader wants
# the bot standing 12 blocks below where it began, stone dug, torches on the way, and no deaths.
prompt: >-
  Dig a safe staircase mine down from where you stand until you are standing 12 blocks lower than you
  are now (y={sy-12}), heading east, with torches on the way down. Check the ground before every step
  down so you never open into lava, water or a cave, and end the task standing at the bottom of the
  staircase.
inventory: {stone_pickaxe: 1, cobblestone: 32, torch: 16, bread: 4}
world: {type: survival, seeds: [1]}
start: {time: day}
movements: {can_dig: true, towers: true, scaffolding: [cobblestone]}
stats: [deaths, damage_taken, "mined:stone", "mined:dirt"]
grader:
  kind: milestones
  required: bottom
  steps:
    - {name: dug,     weight: 1, check: {kind: stat, name: "mined:stone", min: 12}}
    - {name: torches, weight: 1, check: {kind: placed, block: ["torch", "wall_torch"], count: 1}}
    - {name: bottom,  weight: 3, check: {kind: position, target_rel: [0, -12, 0], tolerance: 40, y_tolerance: 1.5}}
    - {name: alive,   weight: 2, hold: true, check: {kind: survived}}
max_turns: 8
max_seconds: 420
exec_timeout: 240
tags: [tier-b, survival, mining, procedures]
