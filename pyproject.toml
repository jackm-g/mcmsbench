[project]
name = "mcmsbench"
version = "0.1.0"
description = "MCMSBench (Minecraft Multiplayer Survival Bench): tasks, worlds and server-truth graders for Minecraft agents, run through one language-neutral protocol"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
summarize = ["anthropic>=0.40"]       # mcmsbench compare --summarize
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.scripts]
mcmsbench = "mcmsbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcmsbench"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "mcmsbench/_data/tasks"
"profiles" = "mcmsbench/_data/profiles"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
