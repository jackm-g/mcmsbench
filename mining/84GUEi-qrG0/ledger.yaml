      Escorting tamed wolves measures understanding of their rules: they teleport to the owner only when standing
      and only onto solid ground, they stay put while sitting, they take damage and need meat, and they follow into
      hazards. Server truth: two wolves alive, sitting, inside the marked room at the end. Overworld version keeps it
      within the arena: the kennel at the base, the destination across a river and a cliff 120 blocks away.
