candidates:
  - id: spawn_proof_the_cavern
    status: drafted
    task: spawn_proof_the_cavern
    source: {from: "04:02", to: "14:16"}
    did: >-
      Cover every surface a mob could spawn on, across the whole area around the fortress, with slabs: the hidden
      caves and corners too, the layers of the bastion, then the fortress itself last. Ran out of cobblestone slabs
      halfway and switched to wooden ones.
    why: >-
      A completeness task with a physical, checkable property: after the work, no block in the volume may have two
      air blocks above a spawnable top. It measures systematic coverage (the sneaky caves, the inside and outside of
      a hallway), material budgeting (he ran out), and knowing which surfaces count (he did not know whether nether
      bricks need covering). The player's own trap was working backwards: slabbing the open ground first so that
      every mob spawned on the fortress he had left for last.
    skills: [building, planning, nether, coverage]
    failure_modes:
      - "missed spots in caves and under overhangs ('a million spots I've missed')"
      - "ran out of the material; a second material had to do"
      - "covered blocks that did not need covering (time) or skipped ones that did"
    world: flat
    setup: >-
      A Nether plot carved into a cavern: an irregular floor with two side pockets and a ledge, a 5x9 nether-brick
      walkway through it, a chest with exactly enough cobblestone slabs for about 80% of the surfaces plus some
      planks, a stone pickaxe. Random ticks are frozen so nothing changes under the bot.
    grader:
      required: [no_spawnable, alive]
      steps:
        - {name: slabs_down, weight: 1, check: {kind: placed, block: "*_slab", count: 60}}
        - {name: no_spawnable, weight: 4, check: {kind: blocks, block: netherrack, min: 0}}
        - {name: walkway_intact, weight: 1, check: {kind: intact, of: setup}}
        - {name: alive, weight: 1, hold: true, check: {kind: survived}}
    params:
      shape: {default: pockets, choices: [pockets, ledge, hallway]}
      budget: {default: 0.8, choices: [0.7, 0.8, 1.0]}
    overlaps: [make_safe, shelter_in_desert]
    tier: tier-c
    budget: {seconds: 600, turns: 25}
    risks:
      - "needs a new grader kind: `spawnable` (from the after snapshot: a full solid top with two air above and no slab, carpet or button on it); the `blocks` step above is a placeholder for it"
      - "the plot's cavern must be carved deterministically in setup (fill commands), so every instance's surface count is known for the slab budget"
      - "make_safe grades the live guard; this grades the world, which is the difference worth stating in the design notes"
    decision: "approved 2026-10-11; drafted as tasks/spawn_proof_the_cavern.yaml with the `spawnable` grader (262 surfaces, a 16x16 room)"

  - id: trap_the_piglin
    status: candidate
    source: {from: "20:41", to: "21:36"}
    did: >-
      Get a piglin from the bastion into a one-block cell in the middle of the platform: a staircase up into the
      fortress, bait it with gold, lead it along the walkway and down into the cell, wall it in, name-tag it.
    why: >-
      Herding a mob that attacks you unless you wear gold, into an exact spot, without killing it. Server truth is
      the piglin's position and name. The judgements are the gold armour (piglin_barter's catch, here the bot must
      wear it to survive the walk), the lure (a gold ingot held, or thrown), and sealing the cell before it wanders.
    skills: [nether, mobs, herding, hazard]
    failure_modes:
      - "the piglin loses interest and wanders off the walkway"
      - "the piglin attacks because no gold armour is worn"
      - "the cell is open on one side and the piglin walks out"
    world: flat
    setup: >-
      Nether plot. A piglin (PersistenceRequired, IsImmuneToZombification) 12 blocks from a raised 1x1 cell with
      walls on three sides, a nether-brick walkway between, a chest holding a golden helmet, 8 gold ingots, a name
      tag, nether bricks. The bot carries a sword and bread.
    grader:
      required: [in_cell, named, alive]
      steps:
        - name: in_cell
          weight: 4
          check: {kind: functional, steps: [{assert: "execute if entity @e[type=minecraft:piglin,x={sx+6},y={sy},z={sz},dx=0,dy=1,dz=0]"}]}
        - name: named
          weight: 1
          check: {kind: functional, steps: [{assert: "execute if entity @e[type=minecraft:piglin,name=!,limit=1]"}]}
        - {name: wore_gold, weight: 1, check: {kind: equipped, slots: {head: golden_helmet}}}
        - {name: not_killed, weight: 1, hold: true, check: {kind: stat, name: "killed:piglin", max: 0}}
        - {name: alive, weight: 1, hold: true, check: {kind: survived}}
    params:
      cell: {default: {dx: 6, dz: 0}, choices: [{dx: 6, dz: 0}, {dx: -5, dz: 4}, {dx: 0, dz: 7}]}
      lure: {default: gold_ingot, choices: [gold_ingot, golden_sword]}
    overlaps: [piglin_barter, beef_ranch]
    tier: tier-c
    budget: {seconds: 480, turns: 20}
    risks:
      - "the `named` assert needs the name-tag name as the task's own choice (`name=` with a quoted string) rather than a not-empty test"
      - "piglins admire gold and may stop to pick up a thrown ingot; confirm that a held ingot draws it along"
    decision: ""

  - id: bring_the_dogs
    status: drafted
    task: bring_the_dogs
