    did: >-
      Take two of your dogs from the kennel at home to the farm's collection room a long way off: through the portal
      (they got stuck), across lava (fly, and they teleport to you on landing), stop when one falls behind, feed one
      that nearly died, land both in the room and sit them where they are wanted.
