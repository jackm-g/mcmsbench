    failure_modes:
      - "a dog left sitting never teleports and is forgotten"
      - "a dog teleports onto a hazard (lava, a cliff) and dies"
      - "only one dog arrives; the other was lost at a crossing"
      - "the dog starves on the way with no food carried"
    world: survival-1
    setup: >-
      Two tamed wolves (Owner set to the bot after it joins, Sitting:1b) in a fenced kennel at seed 1's spawn, a chest
