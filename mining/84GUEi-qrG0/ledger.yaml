        - name: sitting
          weight: 1
          check: {kind: functional, steps: [{assert: "execute unless entity @e[type=minecraft:wolf,nbt={{Sitting:0b}},x={sx+118},y={sy-4},z={sz-2},dx=5,dy=8,dz=5]"}]}
        - {name: no_dog_died, weight: 2, hold: true, check: {kind: stat, name: "killed:wolf", max: 0}}
