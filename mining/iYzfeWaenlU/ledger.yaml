  - id: trap_the_creeper
    status: candidate
    source: {from: "18:05", to: "21:20", frames: ["0-18-26.jpg"]}
    did: >-
      Build a containment chamber under the house, catch a creeper in it at night with a pressure-plate gate and a
      water bucket, and name-tag it so it never despawns. The first creeper exploded because the name tag had not
      been named at an anvil; the second was named and kept.
    why: >-
      Catching a creeper alive is the opposite of fighting one: distance, a funnel, water to push it, and a glass
      cell. The trap the video shows is the game's own: a name tag does nothing until it is renamed at an anvil, so
      the creature despawns (or here, the bench's check finds no CustomName). Server truth: a creeper with a custom
      name inside the cell at the end, the cell intact, no creeper killed.
    skills: [mobs, hazard, redstone, crafting]
    failure_modes:
      - "the creeper blew up next to the player"
      - "the name tag used unnamed: no name on the creeper"
      - "the cell left open or broken; the creeper walked out"
    world: flat
    setup: >-
      A stone room with a 1x1 glass cell open on one side with a gap for a fence gate, a chest with a name tag, an
      anvil, a water bucket, and 3 iron ingots; a creeper (PersistenceRequired) summoned 10 blocks off at night
      level light. The prompt: get the creeper into the cell alive and name it so it stays.
    grader:
      required: [named_in_cell, alive]
      steps:
        - name: in_cell
          weight: 3
          check: {kind: functional, steps: [{assert: "execute if entity @e[type=minecraft:creeper,x={sx+5},y={sy},z={sz},dx=0,dy=1,dz=0]"}]}
        - name: named_in_cell
          weight: 3
          check: {kind: functional, steps: [{assert: "execute if entity @e[type=minecraft:creeper,x={sx+5},y={sy},z={sz},dx=0,dy=1,dz=0,nbt={{CustomName:'\"Elbaton\"'}}]"}]}
        - {name: anvil_used, weight: 1, check: {kind: stat, name: "custom:interact_with_anvil", min: 1}}
        - {name: not_killed, weight: 1, hold: true, check: {kind: stat, name: "killed:creeper", max: 0}}
        - {name: cell_intact, weight: 1, check: {kind: intact, of: setup}}
        - {name: alive, weight: 2, hold: true, check: {kind: survived}}
    params:
      name: {default: Elbaton, choices: [Elbaton, Tors, Boomer]}
      cell: {default: 5, choices: [5, -6]}
    overlaps: [fight_zombies, make_safe]   # and the ledgered trap_the_piglin (mining/84GUEi-qrG0)
    tier: tier-c
    budget: {seconds: 480, turns: 20}
    risks:
      - "a near twin of trap_the_piglin (same video family, same shape: lure a mob into a cell); keep one, or make this one the anvil-and-name-tag task and the piglin the gold-armour one"
      - "a creeper that explodes takes the cell with it: the blast is a world change the grader sees (cell_intact), but the creeper is gone and `killed:creeper` stays 0: that is the right verdict, a fail on in_cell"
      - "the CustomName NBT shape is a JSON text in 1.20.5+: confirm the quoting on the arena"
    decision: ""

