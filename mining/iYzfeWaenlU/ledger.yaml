  - id: trade_up_the_farmer
    status: candidate
    source: {from: "26:33", to: "26:51"}
    did: >-
      Grind a villager's trades with his farm produce until he is master level and sells golden carrots; notes it
      only works with a big farm behind it and that the other villagers are too exposed to zombies to level.
    why: >-
      Trading is a loop with a goal the server can read: the villager's level in its NBT. The judgement is which
      produce the farmer buys (its first trades are random among wheat, potato, carrot and beetroot, so the chest
      holds all four) and how many trades a level takes. Server truth: VillagerData level and the trade counter.
    skills: [trading, planning, containers]
    failure_modes:
      - "traded the wrong crop (not in the villager's offers)"
      - "a trade locked after its uses; waited instead of switching"
      - "the villager hurt or killed"
    world: flat
    setup: >-
      A stall: a villager (farmer, novice, PersistenceRequired, NoAI off) at a composter in a fenced 3x3; a chest
      with 64 of each of wheat, carrot, potato and beetroot. The prompt: get the farmer to Apprentice (level 2).
    grader:
      required: [levelled, alive]
      steps:
        - {name: traded, weight: 1, check: {kind: stat, name: "custom:traded_with_villager", min: 3}}
        - name: levelled
          weight: 4
          says: "the farmer at Apprentice or above at the end"
          check: {kind: functional, steps: [{assert: "execute if entity @e[type=minecraft:villager,tag=farmer,nbt={{VillagerData:{{level:2}}}}]"}, {assert: "execute if entity @e[type=minecraft:villager,tag=farmer]"}]}
        - {name: unharmed, weight: 1, hold: true, check: {kind: stat, name: "killed:villager", max: 0}}
        - {name: alive, weight: 1, hold: true, check: {kind: survived}}
    params:
      profession: {default: {id: farmer, buys: "wheat, carrots, potatoes and beetroot"}, choices: [{id: farmer, buys: "wheat, carrots, potatoes and beetroot"}, {id: fisherman, buys: "string and coal"}, {id: shepherd, buys: "wool and dye"}]}
