title: "100 Days - [Hardcore Minecraft]"
channel: Luke TheNotable
duration: 1801
watched: 2026-10-13
coverage: >-
  Whole transcript (auto captions, 1000 lines, 29 chapters: one a day-range). Frames at 10:33 (the desert ruin's
  sandstone chamber, pickaxe out), 16:48 (the canal: a lit stone cut with still water, from a boat), 18:26 (the
  containment chamber: a glass cell in a stone room) and 24:22 (the enchanting room: shelves in an L against the
  wall, the table beside them).
notes: >-
  A hundred days in thirty minutes, so most objectives get two sentences: stated, then done or failed. The
  failures are stated plainly (the name tag used without an anvil, the creeper that exploded, the shelves "not
  perfect yet", the horse that fell, the first bad omen). Wall-building and tree-clearing fill a third of the run and
  are not minable at the bench's budget. The ocean, the treasure maps, the fishing and the horses are luck or an
  agent's riding, not a judgement.
candidates:
  - id: desert_ruin_chest
    status: drafted
    task: desert_ruin_chest
    source: {from: "10:12", to: "10:46", frames: ["0-10-33.jpg"]}
    did: >-
      Loot a desert ruin he knew was trapped: a creeper inside, the chest in the middle of the chamber over a
      pressure plate on TNT. Took his time, took the loot, took the free TNT too.
    why: >-
      Looting a structure whose floor is the trap: the stone pressure plate in the chamber's centre sets off nine
      TNT under it, which takes the chests, the loot and the bot. Server truth is the TNT still in place, the
      chests still standing, and the emeralds in the bot's hands. The judgement is reading the room (the plate is in
      plain sight, the chests are round it) and the path across it. The video's own history: a death to a creeper
      in a jungle ruin; here, a creeper is in the chamber.
    skills: [exploration, hazard, containers, planning]
    failure_modes:
      - "stepped on the plate and set off the TNT"
      - "broke a chest to get at it instead of opening it"
      - "fought the creeper next to the plate"
    world: flat
    setup: >-
      A sandstone mound 11 wide and 7 high on the plot with the chamber inside it: a 7x7 room 4 high under the
      mound, its floor sandstone, a stone pressure plate in the centre on a block of sandstone with nine TNT under
      that, four chests against the walls holding bones, rotten flesh, a saddle, gold, and the emeralds in one of
      them (the param), a 2-wide shaft from the mound's top down to the room, a creeper (PersistenceRequired)
      summoned in the room's corner. The bot starts on the mound's top with an iron sword, a pickaxe and torches.
    grader:
      required: [emeralds, no_blast, alive]
      steps:
        - {name: in_the_room, weight: 1, check: {kind: position, target_rel: [0, 0], tolerance: 4, y_tolerance: 8}}
        - {name: emeralds, weight: 4, check: {kind: inventory, item: emerald, count: 4}}
        - name: no_blast
          weight: 3
          says: "the trap not set off: the nine TNT under the plate still there, the chests still standing"
          check: {kind: intact, of: setup, exclude: [creeper]}
        - {name: chests_opened, weight: 1, check: {kind: stat, name: "custom:open_chest", min: 2}}
        - {name: alive, weight: 1, hold: true, check: {kind: survived}}
    params:
      loot: {default: ne, choices: [ne, nw, se, sw]}
      creeper: {default: 1, choices: [0, 1]}
    overlaps: [escape_box, cave_gauntlet, axolotl_fetch]
    tier: tier-c
    budget: {seconds: 420, turns: 15}
    risks:
      - "TNT set off by the plate is `intact`'s loss of the TNT and plate blocks, but also the chamber's walls: the exclude list should keep natural sand/sandstone out so partial damage still reads as the trap sprung"
      - "a creeper in a closed room with no light: mobs do not despawn in a 7x7 room at distance 4 from the player; it must be PersistenceRequired and the plot must allow hostile mobs (the arena is peaceful: set the task's difficulty)"
      - "`custom:open_chest` is a vanilla custom stat; confirm its name on the arena"
    decision: "approved 2026-10-13; drafted as tasks/desert_ruin_chest.yaml: the TNT in the chamber's floor inside the observer's volume, the plate excluded from intact (disarming allowed), Easy for the creeper"

  - id: dig_the_canal
    status: candidate
    source: {from: "15:37", to: "17:02", frames: ["0-16-48.jpg"]}
    did: >-
      Cut a canal from the river by the house through a mountain to the ocean so a boat can go the whole way: one
      complete stretch of water, lit, with a shack at each end. Timed the trip afterwards: five minutes by boat.
    why: >-
      A water path for a boat is checkable from the blocks: the `liquid_path` grader follows connected water from
      the home pool to the far pool. The judgements are the trench (two wide, dug through stone, no gap), the water
      itself (a boat rides still water, so sources must be laid end to end with the two-bucket infinite source,
      not one bucket's flow), and then actually boating it (the `boated` counter).
    skills: [digging, water, planning, navigation]
    failure_modes:
      - "a gap of one block in the trench leaves two bodies of water"
      - "flowing water from one source: the boat is pushed back and the far end is dry"
      - "the trench dug at the wrong level, so water falls and does not join"
    world: flat
    setup: >-
      Two 5x5 pools of water one block deep at opposite sides of the plot, 22 blocks apart, a stone ridge 5 high and
      8 thick across the middle, a chest at the home pool with two water buckets, an iron pickaxe, an oak boat and
      16 torches. The prompt asks for a boat to reach the far pool from the home pool on water the whole way, and
      for the bot to make the trip.
    grader:
      required: [joined, boated, alive]
      steps:
        - {name: trench, weight: 1, check: {kind: dug, block: stone, count: 30}}
        - name: joined
          weight: 4
          says: "one connected body of water from the home pool to the far pool"
          check: {kind: liquid_path, liquid: water, from: [6, 0, 16], to: [26, 0, 16]}
        - {name: boated, weight: 2, check: {kind: stat, name: boated, min: 15}}
        - {name: arrived, weight: 1, check: {kind: position, target_rel: [10, 0], tolerance: 5}}
        - {name: alive, weight: 1, hold: true, check: {kind: survived}}
    params:
      ridge: {default: 5, choices: [3, 5, 7]}
      gap: {default: 22, choices: [18, 22, 26]}
    overlaps: [lava_fall, water_drop, ravine_crossing]
    tier: tier-c
    budget: {seconds: 600, turns: 25}
    risks:
      - "`liquid_path` follows connected liquid including flowing water; a canal of flowing water (one source) passes the path check but a boat cannot ride up it, so `boated` is what tells the two apart: confirm the boated counter grows in a boat on still water in a 1-wide channel"
      - "boats and mineflayer: an agent has to mount and steer; nether_highway and island_delivery already ask that, so the capability exists"
    decision: ""

